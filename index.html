<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Match</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: url('https://media.cults3d.com/1Tralalero-Tralala-Hardfacee.png') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: rgba(255, 255, 255, 0.9);
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      width: 320px;
    }
    h1 {
      color: #ff4f81;
      font-size: 22px;
      margin-bottom: 20px;
      text-shadow: 1px 1px 3px #00000040;
    }
    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 2px solid #ff4f81;
      font-size: 16px;
      text-align: center;
    }
    button {
      background: #ff4f81;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    button:hover {
      background: #ff2f6d;
    }
    #resultado {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>💘 Calculadora de Match 💘</h1>
    <input type="text" id="nombre1" placeholder="Ingresa el primer nombre">
    <input type="text" id="nombre2" placeholder="Ingresa el segundo nombre">
    <br>
    <button onclick="calcularMatch()">=</button>
    <div id="resultado"></div>
  </div>

  <script>
    const frases = [
      "🔥 Sexo Aloocado 🔥",
      "💔 Paila ni un pico 💔",
      "💘 Sexo con hijos 💘",
      "😅 Amigos con derechos 😅",
      "🌹 Sexo romantico 🌹",
      "⚡Sexo rapido⚡",
      "🚫 Eso pa que 🚫",
      "😍 Estan enamorados 😍"
    ];

    function calcularMatch() {
      const nombre1 = document.getElementById("nombre1").value.trim();
      const nombre2 = document.getElementById("nombre2").value.trim();
      const resultado = document.getElementById("resultado");

      if (nombre1 === "" || nombre2 === "") {
        resultado.innerHTML = "⚠️ Escribe ambos nombres ⚠️";
        return;
      }

      const fraseRandom = frases[Math.floor(Math.random() * frases.length)];
      resultado.innerHTML = `${nombre1} 💕 ${nombre2}: ${fraseRandom}`;
    }
  </script>
</body>
</html>
